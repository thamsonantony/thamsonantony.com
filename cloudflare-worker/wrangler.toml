name = "qev-proxy"
main = "email-verify.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://thamsonantony.com"
RESUME_PDF_URL = "https://thamsonantony.com/assets/Thamson%20Antony%20Arockiasamy.pdf"
RESUME_EMAIL_HTML_URL = "https://thamsonantony.com/assets/resume-email/email.html"
RESUME_EMAIL_TEXT_URL = "https://thamsonantony.com/assets/resume-email/email.txt"
RESUME_EMAIL_IMAGES_BASE_URL = "https://thamsonantony.com/assets/resume-email/images/"
RESUME_FROM_ADDRESS = "resume@thamsonantony.com"
RESUME_FROM_NAME = "Thamson Antony"

# API keys are NOT set here. Set them as secrets instead, so they never land in the repo:
#   wrangler secret put QEV_API_KEY
#   wrangler secret put RESEND_API_KEY
#
# Email is sent via Resend's REST API (not Cloudflare's native Email Sending —
# that requires the Workers Paid plan to send to arbitrary recipients; on Free
# it's permanently capped to pre-verified destination addresses).
