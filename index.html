<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <meta name="description" content="Coming soon." />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1ea;
      --text: #171411;
      --muted: #6c6257;
      --accent: #c96f4a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(201, 111, 74, 0.14), transparent 35%),
        linear-gradient(180deg, #fbf8f3 0%, var(--bg) 100%);
      text-align: center;
    }

    main {
      max-width: 640px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      margin: 16px 0 0;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .line {
      width: 72px;
      height: 2px;
      margin: 0 auto 24px;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="line" aria-hidden="true"></div>
    <h1>Coming soon.</h1>
    <p>A new version of this site is on the way.</p>
  </main>
</body>
</html>
