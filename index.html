<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thamson Antony</title>
  <link rel="icon" type="image/png" href="the_crown_white.png" sizes="128x128" />
  <meta name="description" content="Thamson Antony — Business Analytics Consultant" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg:         #ffffff;
      --fg:         #0a0a0a;
      --fg-70:      rgba(10,10,10,0.7);
      --fg-40:      rgba(10,10,10,0.4);
      --fg-05:      rgba(10,10,10,0.05);
      --border:     rgba(10,10,10,0.2);
      --border-50:  rgba(10,10,10,0.12);
      --primary-15: rgba(100,100,100,0.15);
      --primary-20: rgba(100,100,100,0.2);
      --card-bg:    rgba(160,160,160,0.35);
      --inner-bg:   rgba(145,145,145,0.3);
      --social-bg:  rgba(135,135,135,0.32);
      --shadow:     0 25px 60px rgba(0,0,0,0.4);
    }

    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--fg);
      background: #000;
    }

    /* ── Gradient background ── */
    #gradient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    #gradient-bg canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* ── Crown logo ── */
    .crown {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 100;
      width: 160px;
      height: 160px;
      object-fit: contain;
    }

    /* ── Nav bar ── */
    .nav-bar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      border: 1px solid var(--border-50);
      background: var(--card-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--fg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-btn:hover {
      background: var(--inner-bg);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }
    .nav-btn svg { width: 20px; height: 20px; }
    .nav-contact {
      height: 48px;
      padding: 0 22px;
      border-radius: 9999px;
      border: 1px solid rgba(180,40,40,0.3);
      background: rgba(180,40,40,0.18);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: rgba(140,20,20,0.95);
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-contact:hover {
      background: rgba(180,40,40,0.28);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }

    /* ── Layout ── */
    .section {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 96px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Glass card — centered, narrow ── */
    .glass-card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 500px;
      border-radius: 2.5rem;
      border: 1px solid var(--border-50);
      background: var(--card-bg);
      padding: 40px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }

    .glass-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--fg-05), transparent, transparent);
      pointer-events: none;
    }

    /* ── Profile card ── */
    .profile-glow {
      position: absolute;
      inset: 0;
      border-radius: 2.5rem;
      background: linear-gradient(to bottom, var(--primary-15), transparent, transparent);
      filter: blur(48px);
      pointer-events: none;
    }

    .profile-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar-wrap { position: relative; margin-bottom: 24px; }

    .avatar-glow {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 128px;
      height: 128px;
      border-radius: 9999px;
      background: var(--primary-20);
      filter: blur(32px);
    }

    .avatar {
      position: relative;
      width: 128px;
      height: 128px;
      border-radius: 9999px;
      object-fit: cover;
      border: 1px solid var(--border-50);
      box-shadow: var(--shadow);
      display: block;
      transform: rotate(-3deg);
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--fg);
      margin-bottom: 6px;
    }

    .profile-role {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg-40);
    }

    .profile-bio {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--fg-70);
    }

    /* ── Social links ── */
    .social-list { display: flex; flex-direction: column; gap: 10px; }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 1.5rem;
      border: 1px solid var(--border-50);
      background: var(--social-bg);
      padding: 12px 16px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .social-link:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
    }

    .social-left { display: flex; align-items: center; gap: 12px; }

    .social-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 1px solid var(--border-50);
      background: var(--inner-bg);
      color: var(--fg-70);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .social-icon svg { width: 16px; height: 16px; }

    .social-label { font-size: 14px; font-weight: 600; color: var(--fg); }
    .social-handle { font-size: 12px; color: var(--fg-40); }

    .social-arrow { color: var(--fg-40); transition: transform 0.2s, color 0.2s; }
    .social-link:hover .social-arrow { transform: translate(2px,-2px); color: var(--fg-70); }
    .social-arrow svg { width: 16px; height: 16px; display: block; }

    /* ── Entrance animations ── */
    .anim-card {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .anim {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      transition-delay: var(--delay, 0s);
    }
    .anim-scale {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .anim.visible, .anim-card.visible, .anim-scale.visible {
      opacity: 1;
      transform: none;
    }
  </style>
</head>
<body>
  <div id="gradient-bg"></div>

  <img src="the_crown_black.png" alt="Crown" class="crown" />

  <nav class="nav-bar">
    <a href="index.html" class="nav-btn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
    </a>
    <a href="contact.html" class="nav-contact">Contact</a>
  </nav>

  <section class="section">
    <div class="glass-card anim-card" data-observe>
      <div class="glass-overlay"></div>
      <div class="profile-glow"></div>

      <div class="profile-top">
        <div class="avatar-wrap anim-scale" data-observe>
          <div class="avatar-glow"></div>
          <img src="avatar.png" alt="Thamson Antony" class="avatar" />
        </div>

        <div class="anim" style="--delay:.2s" data-observe>
          <p class="profile-name">Thamson Antony</p>
          <p class="profile-role">Business Analytics Consultant</p>
        </div>

        <p class="profile-bio anim" style="--delay:.3s" data-observe>
          Building interfaces that feel considered — pairing solid engineering with a sharp eye for design.
        </p>
      </div>

      <div class="social-list" id="social-list"></div>
    </div>
  </section>

  <script>
    const ICONS = {
      twitter:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835-8.161-10.665h7.009l4.258 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
      linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
      github:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>`,
      dribbble: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 24C5.385 24 0 18.615 0 12S5.385 0 12 0s12 5.385 12 12-5.385 12-12 12zm10.12-10.358c-.35-.11-3.17-.953-6.384-.438 1.34 3.684 1.887 6.684 1.992 7.308 2.3-1.555 3.936-4.02 4.395-6.87zm-6.115 7.808c-.153-.9-.75-4.032-2.19-7.77l-.066.02c-5.79 2.015-7.86 6.025-8.04 6.4 1.73 1.358 3.92 2.166 6.29 2.166 1.42 0 2.77-.29 4-.816zm-11.62-2.073c.232-.4 3.045-5.055 8.332-6.765.135-.045.27-.084.405-.12-.26-.585-.54-1.167-.832-1.74C7.17 11.775 2.206 11.71 1.756 11.7l-.004.312c0 2.633.998 5.037 2.634 6.855zm-2.42-8.955c.46.008 4.683.026 9.477-1.248-1.698-3.018-3.53-5.558-3.8-5.928-2.868 1.35-5.01 3.99-5.676 7.18zM9.6 2.052c.282.38 2.145 2.914 3.822 6 3.645-1.365 5.19-3.44 5.373-3.702-1.81-1.61-4.19-2.586-6.795-2.586-.46 0-.922.033-1.4.098zm10.335 3.483c-.218.29-1.935 2.493-5.724 4.04.24.49.47.985.68 1.486.08.18.15.36.22.53 3.41-.43 6.8.26 7.14.33-.02-2.42-.88-4.64-2.31-6.386z"/></svg>`,
      arrow:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`,
    };

    const socialLinks = [
      { label: 'Twitter',  handle: '@thamsonantony', href: '#', icon: ICONS.twitter  },
      { label: 'LinkedIn', handle: 'Thamson Antony',  href: '#', icon: ICONS.linkedin },
      { label: 'GitHub',   handle: 'thamsonantony',   href: '#', icon: ICONS.github   },
      { label: 'Dribbble', handle: 'thamsonantony',   href: '#', icon: ICONS.dribbble },
    ];

    const list = document.getElementById('social-list');
    socialLinks.forEach((s, i) => {
      const a = document.createElement('a');
      a.className = 'social-link anim';
      a.href = s.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.setProperty('--delay', `${i * 0.08}s`);
      a.setAttribute('data-observe', '');
      a.innerHTML = `
        <div class="social-left">
          <span class="social-icon">${s.icon}</span>
          <div>
            <p class="social-label">${s.label}</p>
            <p class="social-handle">${s.handle}</p>
          </div>
        </div>
        <span class="social-arrow">${ICONS.arrow}</span>`;
      list.appendChild(a);
    });

    const observer = new IntersectionObserver(
      entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
      }),
      { threshold: 0.12 }
    );
    document.querySelectorAll('[data-observe]').forEach(el => observer.observe(el));
  </script>

  <script type="importmap">
    { "imports": { "ogl": "https://esm.sh/ogl" } }
  </script>
  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle } from 'ogl';

    const vert = `
      attribute vec2 uv;
      attribute vec2 position;
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 0, 1); }
    `;
    const frag = `
      precision highp float;
      uniform float uTime, uSwirl, uSpeed, uScale, uOffsetX, uOffsetY, uRotation;
      uniform float uWaveAmp, uWaveFreq, uWaveSpeed, uGrain;
      uniform vec3 uColorA, uColorB, uColorC, uResolution;
      varying vec2 vUv;
      float wave(vec2 uv, float freq, float speed, float time) {
        return sin(uv.x * freq + time * speed) * cos(uv.y * freq + time * speed);
      }
      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
      }
      vec3 colorDodge(vec3 base, vec3 blend) {
        return min(base / (1.0 - blend + 0.0001), 1.0);
      }
      void main() {
        float mr = min(uResolution.x, uResolution.y);
        vec2 uv = (vUv.xy * 2.0 - 1.0) * uResolution.xy / mr;
        uv = uv * uScale + vec2(uOffsetX, uOffsetY);
        float cosR = cos(uRotation); float sinR = sin(uRotation);
        uv = vec2(uv.x * cosR - uv.y * sinR, uv.x * sinR + uv.y * cosR);
        uv.x += wave(uv, uWaveFreq, uWaveSpeed, uTime) * uWaveAmp;
        uv.y += wave(uv + 10.0, uWaveFreq * 1.5, uWaveSpeed * 0.8, uTime) * uWaveAmp * 0.5;
        float angle = atan(uv.y, uv.x); float radius = length(uv);
        angle += uSwirl * radius;
        uv = vec2(cos(angle), sin(angle)) * radius;
        float d = -uTime * 0.5 * uSpeed; float a = 0.0;
        for (float i = 0.0; i < 5.0; ++i) { a += cos(i - d - a * uv.x); d += sin(uv.y * i + a); }
        d += uTime * 0.5 * uSpeed;
        vec3 col = mix(uColorA, uColorB, (sin(d) + 1.0) * 0.5);
        col = mix(col, uColorC, (cos(a) + 1.0) * 0.5);
        float grain = (random(gl_FragCoord.xy + uTime) - 0.5) * uGrain;
        col = colorDodge(col, vec3(0.5 + grain));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const hexToRgb = hex => { const h = hex.replace('#',''); return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]; };
    const [cA, cB, cC] = ['#c8b8a2','#6b6b6b','#0a0a0a'].map(hexToRgb);

    const ctn = document.getElementById('gradient-bg');
    const renderer = new Renderer({ alpha: false });
    const gl = renderer.gl;
    gl.clearColor(0,0,0,1);

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex: vert, fragment: frag,
      uniforms: {
        uTime: {value:0}, uSwirl:{value:0.5}, uSpeed:{value:0.8}, uScale:{value:1.0},
        uOffsetX:{value:0}, uOffsetY:{value:0}, uRotation:{value:90},
        uWaveAmp:{value:0.1}, uWaveFreq:{value:10.0}, uWaveSpeed:{value:0.2}, uGrain:{value:0.06},
        uResolution:{value: new Color(1,1,1)},
        uColorA:{value: new Color(...cA)}, uColorB:{value: new Color(...cB)}, uColorC:{value: new Color(...cC)},
      },
    });
    const mesh = new Mesh(gl, { geometry, program });
    ctn.appendChild(gl.canvas);

    function resize() {
      renderer.setSize(ctn.offsetWidth, ctn.offsetHeight);
      program.uniforms.uResolution.value = new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width/gl.canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    (function update(t) {
      requestAnimationFrame(update);
      program.uniforms.uTime.value = t * 0.001;
      renderer.render({ scene: mesh });
    })(0);
  </script>
</body>
</html>
