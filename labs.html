<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labs – Thamson Antony</title>
  <link rel="icon" type="image/png" href="the_crown_white.png" sizes="256x256" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fg:        #0a0a0a;
      --fg-70:     rgba(10,10,10,0.7);
      --fg-50:     rgba(10,10,10,0.5);
      --fg-40:     rgba(10,10,10,0.4);
      --fg-05:     rgba(10,10,10,0.05);
      --border-50: rgba(10,10,10,0.12);
      --card-bg:   rgba(160,160,160,0.35);
      --inner-bg:  rgba(145,145,145,0.3);
    }

    html, body {
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--fg);
      background: #000;
    }

    #gradient-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    #gradient-bg canvas { width: 100% !important; height: 100% !important; display: block; }

    /* ── Nav ── */
    .nav-bar {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 8px;
    }
    .nav-btn {
      width: 48px; height: 48px; padding: 0 0 0 14px; border-radius: 9999px;
      border: 1px solid var(--border-50); background: var(--card-bg);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      cursor: pointer; text-decoration: none; color: var(--fg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; white-space: nowrap;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-btn:hover { width: 108px; background: var(--inner-bg); box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }
    .nav-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-label { font-size: 14px; font-weight: 600; opacity: 0; flex-shrink: 0; transition: opacity 0.15s ease 0.12s; }
    .nav-btn:hover .nav-label { opacity: 1; }

    .nav-tl {
      width: 48px; height: 48px; padding: 0 0 0 14px; border-radius: 9999px;
      border: 1px solid var(--border-50); background: var(--card-bg);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      cursor: pointer; text-decoration: none; color: var(--fg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; white-space: nowrap;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-tl:hover { width: 126px; background: var(--inner-bg); box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }
    .nav-tl svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-tl-label { font-size: 14px; font-weight: 600; opacity: 0; flex-shrink: 0; transition: opacity 0.15s ease 0.12s; }
    .nav-tl:hover .nav-tl-label { opacity: 1; }

    .nav-certs {
      width: 48px; height: 48px; padding: 0 0 0 14px; border-radius: 9999px;
      border: 1px solid var(--border-50); background: var(--card-bg);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      cursor: pointer; text-decoration: none; color: var(--fg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; white-space: nowrap;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-certs:hover { width: 148px; background: var(--inner-bg); box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }
    .nav-certs svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-certs-label { font-size: 14px; font-weight: 600; opacity: 0; flex-shrink: 0; transition: opacity 0.15s ease 0.12s; }
    .nav-certs:hover .nav-certs-label { opacity: 1; }

    .nav-contact {
      width: 48px; height: 48px; padding: 0 0 0 14px; border-radius: 9999px;
      border: 1px solid rgba(180,40,40,0.3); background: rgba(180,40,40,0.18);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      color: rgba(140,20,20,0.95); text-decoration: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; white-space: nowrap;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-contact:hover { width: 124px; background: rgba(180,40,40,0.28); box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }
    .nav-contact svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-contact-label { font-size: 14px; font-weight: 600; opacity: 0; flex-shrink: 0; transition: opacity 0.15s ease 0.12s; }
    .nav-contact:hover .nav-contact-label { opacity: 1; }

    .nav-labs {
      width: 48px; height: 48px; padding: 0 0 0 14px; border-radius: 9999px;
      border: 1px solid var(--border-50); background: var(--inner-bg);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      cursor: pointer; text-decoration: none; color: var(--fg);
      box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; white-space: nowrap;
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1), background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .nav-labs:hover { width: 108px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }
    .nav-labs svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-labs-label { font-size: 14px; font-weight: 600; opacity: 0; flex-shrink: 0; transition: opacity 0.15s ease 0.12s; }
    .nav-labs:hover .nav-labs-label { opacity: 1; }

    .nav-bar a { position: relative; }
    .nav-bar a.active::after {
      content: '';
      position: absolute;
      bottom: 5px; left: 24px;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #000;
      pointer-events: none;
    }

    /* ── Parallax ── */
    .parallax { position: relative; z-index: 1; }

    .parallax__header {
      position: relative;
      height: 200vh;
    }

    .parallax__visuals {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .parallax__black-line-overflow {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #000;
      z-index: 20;
    }

    [data-parallax-layers].parallax__layers {
      position: absolute;
      inset: 0;
    }

    .parallax__layer-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    [data-parallax-layer="1"] { z-index: 1; }
    [data-parallax-layer="2"] { z-index: 2; }
    [data-parallax-layer="3"] { z-index: 3; }
    [data-parallax-layer="4"] { z-index: 4; }

    .parallax__layer-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .parallax__title {
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.04em;
      text-shadow: 0 4px 40px rgba(0,0,0,0.25);
    }

    .parallax__fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.55));
      z-index: 10;
      pointer-events: none;
    }

    /* ── Content below parallax ── */
    .parallax__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 96px 48px 72px;
      text-align: center;
    }

    .osmo-icon-svg {
      width: 64px;
      height: auto;
      color: var(--fg);
      opacity: 0.3;
    }

    .content-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(0,0,0,0.4);
    }

    /* ── Page nav ── */
    .page-nav {
      position: relative; z-index: 1;
      display: flex; justify-content: center; align-items: center;
      gap: 16px; padding: 0 48px 80px;
    }
    .page-nav-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 9999px;
      border: 1px solid var(--border-50); background: var(--card-bg);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      font-size: 14px; font-weight: 600; color: var(--fg); text-decoration: none;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .page-nav-btn:hover { background: var(--inner-bg); box-shadow: 0 8px 32px rgba(0,0,0,0.2); transform: translateY(-2px); }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .nav-bar {
        top: auto; bottom: 18px; padding: 6px;
        background: rgba(160,160,160,0.4);
        border: 1px solid var(--border-50); border-radius: 9999px;
        backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
        box-shadow: 0 8px 28px rgba(0,0,0,0.2);
      }
      .nav-btn, .nav-tl, .nav-certs, .nav-contact, .nav-labs {
        width: 44px; height: 44px; padding: 0; justify-content: center;
        background: transparent; border: none; box-shadow: none;
      }
      .nav-btn:hover, .nav-tl:hover, .nav-certs:hover, .nav-contact:hover, .nav-labs:hover {
        width: 44px; background: rgba(255,255,255,0.18); transform: none; box-shadow: none;
      }
      .nav-label, .nav-tl-label, .nav-certs-label, .nav-contact-label, .nav-labs-label { display: none; }
      .nav-bar a.active::after { bottom: 4px; left: 50%; }
      .parallax__content { padding: 64px 24px 48px; }
      .page-nav { padding: 0 16px 110px; }
    }
  </style>
</head>

  <!-- GSAP + ScrollTrigger + Lenis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const triggerElement = document.querySelector('[data-parallax-layers]');

    if (triggerElement) {
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: triggerElement,
          start: "0% 0%",
          end: "100% 0%",
          scrub: 0
        }
      });

      const layers = [
        { layer: "1", yPercent: 70 },
        { layer: "2", yPercent: 55 },
        { layer: "3", yPercent: 40 },
        { layer: "4", yPercent: 10 }
      ];

      layers.forEach((layerObj, idx) => {
        tl.to(
          triggerElement.querySelectorAll(`[data-parallax-layer="${layerObj.layer}"]`),
          { yPercent: layerObj.yPercent, ease: "none" },
          idx === 0 ? undefined : "<"
        );
      });
    }

    const lenis = new Lenis();
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => { lenis.raf(time * 1000); });
    gsap.ticker.lagSmoothing(0);
  </script>

  <!-- OGL gradient background -->
  <script type="importmap">
    { "imports": { "ogl": "https://esm.sh/ogl" } }
  </script>
  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle } from 'ogl';

    const vert = `
      attribute vec2 uv; attribute vec2 position; varying vec2 vUv;
      void main() { vUv = uv; gl_Position = vec4(position, 0, 1); }
    `;
    const frag = `
      precision highp float;
      uniform float uTime, uSwirl, uSpeed, uScale, uOffsetX, uOffsetY, uRotation;
      uniform float uWaveAmp, uWaveFreq, uWaveSpeed, uGrain;
      uniform vec3 uColorA, uColorB, uColorC, uResolution;
      varying vec2 vUv;
      float wave(vec2 uv, float freq, float speed, float time) {
        return sin(uv.x * freq + time * speed) * cos(uv.y * freq + time * speed);
      }
      float random(vec2 st) {
        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
      }
      vec3 colorDodge(vec3 base, vec3 blend) { return min(base / (1.0 - blend + 0.0001), 1.0); }
      void main() {
        float mr = min(uResolution.x, uResolution.y);
        vec2 uv = (vUv.xy * 2.0 - 1.0) * uResolution.xy / mr;
        uv = uv * uScale + vec2(uOffsetX, uOffsetY);
        float cosR = cos(uRotation); float sinR = sin(uRotation);
        uv = vec2(uv.x * cosR - uv.y * sinR, uv.x * sinR + uv.y * cosR);
        uv.x += wave(uv, uWaveFreq, uWaveSpeed, uTime) * uWaveAmp;
        uv.y += wave(uv + 10.0, uWaveFreq * 1.5, uWaveSpeed * 0.8, uTime) * uWaveAmp * 0.5;
        float angle = atan(uv.y, uv.x); float radius = length(uv);
        angle += uSwirl * radius;
        uv = vec2(cos(angle), sin(angle)) * radius;
        float d = -uTime * 0.5 * uSpeed; float a = 0.0;
        for (float i = 0.0; i < 5.0; ++i) { a += cos(i - d - a * uv.x); d += sin(uv.y * i + a); }
        d += uTime * 0.5 * uSpeed;
        vec3 col = mix(uColorA, uColorB, (sin(d) + 1.0) * 0.5);
        col = mix(col, uColorC, (cos(a) + 1.0) * 0.5);
        float grain = (random(gl_FragCoord.xy + uTime) - 0.5) * uGrain;
        col = colorDodge(col, vec3(0.5 + grain));
        gl_FragColor = vec4(col, 1.0);
      }
    `;

    const hexToRgb = hex => { const h = hex.replace('#',''); return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]; };
    const [cA, cB, cC] = ['#888888','#555555','#333333'].map(hexToRgb);

    const ctn = document.getElementById('gradient-bg');
    const renderer = new Renderer({ alpha: false });
    const gl = renderer.gl;
    gl.clearColor(0,0,0,1);

    const geometry = new Triangle(gl);
    const program = new Program(gl, {
      vertex: vert, fragment: frag,
      uniforms: {
        uTime:{value:0}, uSwirl:{value:0.5}, uSpeed:{value:0.8}, uScale:{value:1.0},
        uOffsetX:{value:0}, uOffsetY:{value:0}, uRotation:{value:90},
        uWaveAmp:{value:0.04}, uWaveFreq:{value:3.0}, uWaveSpeed:{value:0.2}, uGrain:{value:0.0},
        uResolution:{value: new Color(1,1,1)},
        uColorA:{value: new Color(...cA)}, uColorB:{value: new Color(...cB)}, uColorC:{value: new Color(...cC)},
      },
    });
    const mesh = new Mesh(gl, { geometry, program });
    ctn.appendChild(gl.canvas);

    function resize() {
      renderer.setSize(ctn.offsetWidth, ctn.offsetHeight);
      program.uniforms.uResolution.value = new Color(gl.canvas.width, gl.canvas.height, gl.canvas.width/gl.canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    (function update(t) {
      requestAnimationFrame(update);
      program.uniforms.uTime.value = t * 0.001;
      renderer.render({ scene: mesh });
    })(0);
  </script>
</body>
